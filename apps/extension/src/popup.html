<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Charcoal Helper</title>
    <style>
      body { margin: 0; width: 300px; padding: 18px; font: 14px/1.45 system-ui, sans-serif; background: #0d1016; color: #f4f5f7; }
      h1 { font-size: 16px; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
      p { margin: 6px 0; color: #98a0ad; }
      .ok { color: #00d492; }
      .warn { color: #ff8904; }
      button { margin-top: 10px; width: 100%; height: 38px; border: 0; border-radius: 999px; background: #f4f5f7; color: #000; font-weight: 600; cursor: pointer; }
      img { width: 22px; height: 22px; }
    </style>
  </head>
  <body>
    <h1><img src="icon.png" alt="" /> Charcoal Helper</h1>
    <p id="status">Checking…</p>
    <p>On Charcoal, sources are found and played from your own connection, so more of them work.</p>
    <button id="grant" hidden>Allow access to streaming sites</button>
    <script src="popup.js"></script>
  </body>
</html>
